<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantasy Kop 7</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #146c3f;
    --card: #1c7f4c;
    --card-selected: #0d5233;
    --border: #2f9463;
    --border-hover: #4bb37f;
    --accent: #ffffff;
    --text-bright: #ffffff;
    --text-primary: #ffffff;
    --text-muted: #dff5e6;
    --text-faint: #a8dcbc;
    --danger: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .glow { box-shadow: 0 0 0 1px rgba(255,255,255,0.22), 0 8px 30px -10px rgba(0,0,0,0.5); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select { font-family: inherit; }
  a { color: inherit; }

  header.top { border-bottom: 1px solid var(--border); }
  .header-inner { padding: 32px 0 24px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 56px; height: auto; flex-shrink: 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.3em; color: var(--accent); margin-bottom: 4px; }
  h1.title { font-size: 40px; line-height: 1; margin: 0; color: var(--text-bright); }
  .journee-box { text-align: right; }
  .journee-label { font-size: 10px; letter-spacing: 0.15em; color: var(--text-faint); }
  .journee-num { font-size: 30px; line-height: 1; color: var(--accent); }
  .subtitle { margin-top: 12px; font-size: 14px; color: var(--text-muted); max-width: 560px; }

  nav.tabs { display: flex; gap: 8px; margin-top: 20px; }
  nav.tabs button {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.02em;
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted);
  }
  nav.tabs button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  main { padding: 24px 0 60px; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .card-tight { padding: 14px 16px; }
  .card h3.eyebrow { margin: 0 0 8px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .faint { color: var(--text-faint); font-size: 11px; }

  .row { display: flex; gap: 8px; }
  .row input[type=text], .row input[type=password], .row input[type=number] {
    flex: 1; border-radius: 10px; padding: 9px 12px; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-primary); outline: none;
  }
  .btn-gold {
    background: var(--accent); color: var(--bg); font-weight: 700; font-size: 14px;
    padding: 9px 16px; border-radius: 10px;
  }
  .btn-gold:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 999px; padding: 6px 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .btn-danger { background: var(--danger); color: var(--bg); font-weight: 700; border-radius: 999px; padding: 6px 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .link { text-decoration: underline; text-underline-offset: 2px; font-size: 11px; font-family: 'JetBrains Mono', monospace; background: none; color: var(--text-faint); }

  .status-line { display: flex; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-faint); }

  .player-row {
    display: flex; align-items: center; gap: 12px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); padding: 12px 16px; cursor: pointer; transition: border-color .15s;
  }
  .player-row.selected { border-color: var(--accent); background: var(--card-selected); }
  .player-row.disabled { opacity: .6; cursor: not-allowed; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    background: var(--bg); border: 1.5px solid var(--border); color: var(--text-primary);
  }
  .player-row.selected .avatar { border-color: var(--accent); }
  .player-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-faint); width: 22px; text-align: right; flex-shrink: 0; }
  .player-name { font-size: 14px; font-weight: 600; color: var(--text-bright); }
  .player-pos { font-size: 11px; color: var(--text-muted); }

  .bonus-row {
    width: 100%; display: flex; align-items: center; gap: 12px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg); padding: 10px 14px; text-align: left;
  }
  .bonus-row.active { border-color: var(--accent); background: var(--card-selected); }
  .bonus-row:disabled { opacity: .6; cursor: not-allowed; }
  .bonus-icon { font-size: 20px; line-height: 1; }
  .bonus-title { font-size: 14px; font-weight: 600; color: var(--text-bright); display: flex; gap: 6px; align-items: baseline; }
  .bonus-desc { font-size: 11px; color: var(--text-muted); }
  .bonus-status { font-family: 'JetBrains Mono', monospace; font-size: 10px; flex-shrink: 0; text-align: right; }

  select.field {
    width: 100%; border-radius: 10px; padding: 9px 12px; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-primary); outline: none;
  }
  label.field-label { display: block; font-size: 11px; margin-bottom: 4px; color: var(--text-faint); }

  .rank-row { border-radius: 14px; border: 1px solid var(--border); background: var(--card); padding: 12px 16px; }
  .rank-row.me { border-color: var(--accent); background: var(--card-selected); }
  .rank-head { display: flex; align-items: center; justify-content: space-between; }
  .rank-pos { font-family: 'Anton', sans-serif; font-size: 18px; width: 32px; text-align: center; }
  .rank-name { font-size: 14px; font-weight: 600; color: var(--text-bright); }
  .rank-total { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--accent); }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }
  .chip-row { margin-top: 8px; margin-left: 44px; display: flex; flex-wrap: wrap; gap: 6px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card-selected); border: 1px solid rgba(255,255,255,0.5); color: var(--text-bright);
    font-size: 14px; padding: 10px 16px; border-radius: 12px; z-index: 50;
  }

  .admin-participant { display: flex; align-items: center; justify-content: between; gap: 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; }
  .admin-participant-name { flex: 1; font-size: 14px; color: var(--text-bright); }
  .admin-actions { display: flex; gap: 10px; }

  .field-pair { display: flex; gap: 12px; }
  .field-pair > div { flex: 1; }

  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
</style>
</head>

function normalizePick(raw) {
  if (!raw) return null;
  if (typeof raw === "string") return { player: raw, cocu: false, jeanmarc: false, joker: null };
  return { player: raw.player, cocu: !!raw.cocu, jeanmarc: !!raw.jeanmarc, joker: raw.joker || null };
}

function matchPoints(pred, result) {
  if (!pred || !result) return null;
  if (pred.csp === result.csp && pred.adv === result.adv) return 15;
  const predDiff = pred.csp - pred.adv;
  const actDiff = result.csp - result.adv;
  const predWinner = predDiff > 0 ? "csp" : predDiff < 0 ? "adv" : "nul";
  const actWinner = actDiff > 0 ? "csp" : actDiff < 0 ? "adv" : "nul";
  if (predWinner !== actWinner) return 0;
  return Math.abs(Math.abs(predDiff) - Math.abs(actDiff)) <= 5 ? 6 : 3;
}

function slug(name) {
  return String(name).replace(/[^a-zA-Z0-9]+/g, "-");
}

function initials(name) {
  return name.split(" ").slice(0, 2).map((w) => w[0]).join("").toUpperCase();
}

function formatDateTime(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    return iso;
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function safeStorageGet(key, shared) {
  try {
    return await window.storage.get(key, shared);
  } catch (e) {
    return null;
  }
}

async function safeStorageSet(key, value, shared) {
  try {
    return await window.storage.set(key, value, shared);
  } catch (e) {
    // petite marge : une seconde tentative après un court délai, pour absorber
    // les échecs transitoires ponctuels du backend de stockage
    await new Promise((r) => setTimeout(r, 400));
    return await window.storage.set(key, value, shared);
  }
}

};

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 2800);
}

// ---------------------------- derived ----------------------------
function derived() {
  const currentJ = String(S.meta.current);
  const currentJd = S.meta.journees[currentJ] || {};
  const currentStatus = currentJd.status || "open";
  const fixture = currentJd.fixture || "";
  const opensAt = currentJd.opensAt || "";
  const closesAt = currentJd.closesAt || "";
  const pastDeadline = !!closesAt && S.now > new Date(closesAt);
  const beforeOpening = !!opensAt && S.now < new Date(opensAt);
  const bettingOpen = currentStatus === "open" && !pastDeadline && !beforeOpening;
  const jokerDeadline = closesAt ? new Date(new Date(closesAt).getTime() + JOKER_GRACE_MINUTES * 60000) : null;
  const jokerPastDeadline = !!jokerDeadline && S.now > jokerDeadline;
  const jokerOpen = currentStatus === "open" && !beforeOpening && !jokerPastDeadline;
  const myPickRaw = S.picks[currentJ] ? S.picks[currentJ][S.pseudo] : undefined;
  const myPick = normalizePick(myPickRaw);
  const myPrediction = S.predictions[currentJ] ? S.predictions[currentJ][S.pseudo] : null;

  let cocuJ = null, jeanmarcJ = null;
  Object.entries(S.meta.journees).forEach(([j, jd]) => {
    if (jd.status !== "closed") return;
    const p = normalizePick(S.picks[j] && S.picks[j][S.pseudo]);
    if (p && p.cocu) cocuJ = j;
    if (p && p.jeanmarc) jeanmarcJ = j;
  });

  return {
    currentJ, currentJd, currentStatus, fixture, opensAt, closesAt,
    pastDeadline, beforeOpening, bettingOpen, jokerDeadline, jokerPastDeadline, jokerOpen,
    myPick, myPrediction, cocuJ, jeanmarcJ, cocuLocked: !!cocuJ, jeanmarcLocked: !!jeanmarcJ,
  };
}

function computeRanking() {
  const totals = {};
  Object.entries(S.meta.journees).forEach(([j, jd]) => {
    if (jd.status !== "closed") return;
    const jPicks = S.picks[j] || {};
    Object.entries(jPicks).forEach(([who, raw]) => {
      const p = normalizePick(raw);
      if (!p) return;
      const starterDNP = !!(jd.dnp && jd.dnp[p.player]);
      let playerUsed = p.player, jokerUsed = false, base;
      if (starterDNP && p.joker) {
        const jokerDNP = !!(jd.dnp && jd.dnp[p.joker]);
        if (jokerDNP) { base = 0; }
        else { base = jd.scores && jd.scores[p.joker] != null ? Number(jd.scores[p.joker]) : 0; playerUsed = p.joker; jokerUsed = true; }
      } else if (starterDNP && !p.joker) {
        base = 0;
      } else {
        base = jd.scores && jd.scores[p.player] != null ? Number(jd.scores[p.player]) : 0;
      }
      let score = base;
      const jeanmarcSaved = p.jeanmarc && base < 0;
      if (jeanmarcSaved) score = 0;
      if (p.cocu) score = score * 2;
      if (!totals[who]) totals[who] = { total: 0, detail: [] };
      totals[who].total += score;
      totals[who].detail.push({ kind: "player", j, player: p.player, playerUsed, jokerUsed, starterDNP, base, score, cocu: p.cocu, jeanmarc: p.jeanmarc, jeanmarcSaved });
    });
    const jPreds = S.predictions[j] || {};
    Object.entries(jPreds).forEach(([who, pred]) => {
      const pts = matchPoints(pred, jd.matchResult);
      if (pts == null) return;
      if (!totals[who]) totals[who] = { total: 0, detail: [] };
      totals[who].total += pts;
      totals[who].detail.push({ kind: "prono", j, pred, result: jd.matchResult, score: pts });
    });
  });
  return Object.entries(totals).map(([who, v]) => ({ who, ...v })).sort((a, b) => b.total - a.total);
}

function computeSuivi(ranking) {
  const closedJourneeNums = Object.entries(S.meta.journees)
    .filter(([, jd]) => jd.status === "closed").map(([j]) => j).sort((a, b) => Number(a) - Number(b));

  const journeeMvp = closedJourneeNums.map((j) => {
    const perPseudo = {};
    ranking.forEach((r) => {
      const has = r.detail.some((d) => d.j === j);
      if (has) perPseudo[r.who] = r.detail.filter((d) => d.j === j).reduce((s, d) => s + d.score, 0);
    });
    const entries = Object.entries(perPseudo);
    if (entries.length === 0) return { j, best: null, score: null };
    const [best, score] = entries.reduce((a, b) => (b[1] > a[1] ? b : a));
    return { j, best, score };
  });

  const history = ranking.map((r) => {
    let running = 0;
    const points = closedJourneeNums.map((j) => {
      running += r.detail.filter((d) => d.j === j).reduce((s, d) => s + d.score, 0);
      return running;
    });
    return { who: r.who, points };
  });

  return { journeeMvp, history };
}

function sparklineSVG(points, color) {
  const w = 220, h = 32;
  const min = Math.min(0, ...points);
  const max = Math.max(1, ...points);
  const range = max - min || 1;
  const step = points.length > 1 ? w / (points.length - 1) : 0;
  const coords = points.map((v, i) => [i * step, h - ((v - min) / range) * h]);
  const path = coords.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const [lastX, lastY] = coords[coords.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.85" />
    <circle cx="${lastX}" cy="${lastY}" r="2.5" fill="${color}" />
  </svg>`;
}

async function init() {
  const [pRes, mRes, kRes, wRes, pinRes, predRes] = await Promise.all([
    safeStorageGet("csp-pseudo", false),
    safeStorageGet("csp-journees", true),
    safeStorageGet("csp-picks", true),
    safeStorageGet("csp-whitelist", true),
    safeStorageGet("csp-pins", true),
    safeStorageGet("csp-predictions", true),
  ]);
  if (pRes) S.pseudo = pRes.value;
  if (mRes) { S.meta = JSON.parse(mRes.value); }
  else { S.meta = emptyMeta(); await safeStorageSet("csp-journees", JSON.stringify(S.meta), true).catch(() => {}); }
  if (kRes) { S.picks = JSON.parse(kRes.value); }
  else { S.picks = {}; await safeStorageSet("csp-picks", JSON.stringify({}), true).catch(() => {}); }
  if (wRes) S.whitelist = JSON.parse(wRes.value);
  if (pinRes) S.pins = JSON.parse(pinRes.value);
  if (predRes) S.predictions = JSON.parse(predRes.value);
  S.loading = false;
  render();
}

async function savePseudo(name) {
  const clean = (name || "").trim();
  if (!clean) return;
  S.pseudo = clean;
  try { await safeStorageSet("csp-pseudo", clean, false); } catch (e) { console.error(e); }
}

function attemptLogin() {
  const raw = document.getElementById("pseudo-input").value;
  const name = raw.trim();
  if (!name) return;
  if (S.whitelist.length === 0) { savePseudo(name); render(); return; }
  const match = S.whitelist.find((w) => w.toLowerCase() === name.toLowerCase());
  if (!match) { showToast("Pseudo non autorisé — demande à l'admin de t'ajouter à la liste des participants."); return; }
  S.pendingName = match;
  S.pinMode = S.pins[match] ? "enter" : "create";
  render();
}

async function confirmPin() {
  const pinInput = document.getElementById("pin-input").value.trim();
  if (!S.pendingName) return;
  if (S.pinMode === "create") {
    if (pinInput.length < 4) { showToast("Choisis un code d'au moins 4 chiffres."); return; }
    S.saving = true;
    try {
      const latest = await safeStorageGet("csp-pins", true);
      const current = latest ? JSON.parse(latest.value) : {};
      const next = { ...current, [S.pendingName]: pinInput };
      await safeStorageSet("csp-pins", JSON.stringify(next), true);
      S.pins = next;
      await savePseudo(S.pendingName);
      showToast(`Code créé pour ${S.pendingName}.`);
      S.pendingName = null; S.pinMode = null;
    } catch (e) { console.error(e); showToast("Échec de l'enregistrement, réessaie."); }
    finally { S.saving = false; render(); }
  } else {
    if (S.pins[S.pendingName] === pinInput) {
      await savePseudo(S.pendingName);
      S.pendingName = null; S.pinMode = null;
      render();
    } else {
      showToast("Code incorrect.");
    }
  }
}

function cancelPending() { S.pendingName = null; S.pinMode = null; render(); }
function logout() { S.pseudo = ""; render(); }

async function writePick(nextPickObj) {
  S.saving = true;
  try {
    const d = derived();
    const latest = await safeStorageGet("csp-picks", true);
    const current = latest ? JSON.parse(latest.value) : {};
    const forJ = { ...(current[d.currentJ] || {}), [S.pseudo]: nextPickObj };
    const next = { ...current, [d.currentJ]: forJ };
    await safeStorageSet("csp-picks", JSON.stringify(next), true);
    S.picks = next;
    return true;
  } catch (e) { console.error(e); showToast("Échec de l'enregistrement, réessaie."); return false; }
  finally { S.saving = false; }
}

async function submitPick(player) {
  const d = derived();
  if (!S.pseudo) { showToast("Choisis d'abord un pseudo."); return; }
  if (!d.bettingOpen) { showToast(d.pastDeadline ? "Le délai des pronostics est dépassé pour cette journée." : "Les pronostics de cette journée sont clos."); return; }
  const keepCocu = d.myPick && d.myPick.cocu && !d.cocuLocked;
  const keepJeanmarc = d.myPick && d.myPick.jeanmarc && !d.jeanmarcLocked;
  const keepJoker = d.myPick && d.myPick.joker && d.myPick.joker !== player ? d.myPick.joker : null;
  const ok = await writePick({ player, cocu: !!keepCocu, jeanmarc: !!keepJeanmarc, joker: keepJoker });
  if (ok) showToast(`Pronostic enregistré : ${player}`);
  render();
}

async function toggleBonus(kind) {
  const d = derived();
  if (!S.pseudo || !d.myPick) { showToast("Choisis d'abord un joueur."); return; }
  if (!d.bettingOpen) { showToast(d.pastDeadline ? "Le délai des pronostics est dépassé pour cette journée." : "Les pronostics de cette journée sont clos."); return; }
  if (kind === "cocu" && d.cocuLocked) return;
  if (kind === "jeanmarc" && d.jeanmarcLocked) return;
  const nextVal = { ...d.myPick, [kind]: !d.myPick[kind] };
  const ok = await writePick(nextVal);
  if (ok) showToast(nextVal[kind] ? (kind === "cocu" ? "Bonus Cocu activé — points doublés 🥂" : "Bonus Vidéo Jean Marc activé 📹") : "Bonus désactivé");
  render();
}

async function setJoker(playerOrNull) {
  const d = derived();
  if (!S.pseudo || !d.myPick) { showToast("Choisis d'abord ton titulaire."); return; }
  if (!d.jokerOpen) { showToast("La marge pour choisir un joker banc est dépassée."); return; }
  const ok = await writePick({ ...d.myPick, joker: playerOrNull || null });
  if (ok) showToast(playerOrNull ? `Joker banc : ${playerOrNull}` : "Joker banc retiré");
  render();
}

async function submitPrediction() {
  const d = derived();
  if (!S.pseudo) { showToast("Choisis d'abord un pseudo."); return; }
  if (!d.bettingOpen) { showToast("Les pronostics de cette journée sont clos."); return; }
  const csp = Number(document.getElementById("pred-csp").value);
  const adv = Number(document.getElementById("pred-adv").value);
  const cspRaw = document.getElementById("pred-csp").value;

  if (cspRaw === "" || advRaw === "" || Number.isNaN(csp) || Number.isNaN(adv) || csp < 0 || adv < 0) {
    showToast("Entre un score valide pour les deux équipes."); return;
  }
  S.saving = true;
  try {
    const latest = await safeStorageGet("csp-predictions", true);
    const current = latest ? JSON.parse(latest.value) : {};
    const forJ = { ...(current[d.currentJ] || {}), [S.pseudo]: { csp, adv } };
    const next = { ...current, [d.currentJ]: forJ };
    await safeStorageSet("csp-predictions", JSON.stringify(next), true);
    S.predictions = next;
    showToast(`Prono enregistré : CSP ${csp} - ${adv}`);

      <div class="card glow">
        <div class="eyebrow mono" style="margin-bottom:8px">${S.pinMode === "create" ? "CRÉER TON CODE" : "CODE SECRET"}</div>
        <p class="muted" style="margin:0 0 12px">
          ${S.pinMode === "create"
            ? `Première connexion pour <strong style="color:var(--text-bright)">${esc(S.pendingName)}</strong> : choisis un code (4 chiffres min.) pour que personne d'autre ne puisse jouer sous ton pseudo.`
            : `Entre ton code pour continuer en tant que <strong style="color:var(--text-bright)">${esc(S.pendingName)}</strong>.`}
        </p>
        <div class="row">
          <input id="pin-input" type="password" inputmode="numeric" placeholder="Code" onkeydown="if(event.key==='Enter') confirmPin()" />
          <button class="btn-gold" onclick="confirmPin()" ${S.saving ? "disabled" : ""}>Valider</button>
        </div>
        <button class="link" style="margin-top:8px" onclick="cancelPending()">changer de pseudo</button>
      </div>`;
    }
  } else {
    identBlock = `
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:14px">
      <div class="muted">Connecté comme <strong style="color:var(--text-bright)">${esc(S.pseudo)}</strong></div>
      <button class="link" onclick="logout()">changer</button>
    </div>`;
  }

  const fixtureBlock = (d.fixture || d.opensAt || d.closesAt) ? `
    <div class="card card-tight">
      ${d.fixture ? `<div style="font-weight:600;color:var(--text-bright);margin-bottom:4px">${esc(d.fixture)}</div>` : ""}
      ${(d.opensAt || d.closesAt) ? `<div class="mono muted" style="font-size:11px;line-height:1.6">
        ${d.opensAt ? `Ouverture des paris : ${formatDateTime(d.opensAt)}<br/>` : ""}
        ${d.closesAt ? `Fermeture des paris : ${formatDateTime(d.closesAt)}` : ""}
      </div>` : ""}
    </div>` : "";

  const statusLabel = d.bettingOpen ? "PRONOSTICS OUVERTS" : d.beforeOpening ? "PAS ENCORE OUVERTS" : d.pastDeadline ? "DÉLAI DÉPASSÉ" : "CLÔTURÉE";
  const statusColor = d.bettingOpen ? "var(--accent)" : "var(--danger)";

  const statusBlock = `
    <div class="status-line">
      <div>JOURNÉE ${S.meta.current} · <span id="status-text" style="color:${statusColor}">${statusLabel}</span></div>
      ${d.myPick ? `<div class="mono" style="color:var(--accent)">Ton choix : <strong>${esc(d.myPick.player)}</strong></div>` : ""}
    </div>`;

  const playersBlock = `
    <div class="stack" style="gap:8px" id="players-list">
      ${PLAYERS.map((p) => {
        const selected = d.myPick && d.myPick.player === p.name;
        const disabled = !S.pseudo || !d.bettingOpen;
        return `
        <label class="player-row ${selected ? "selected" : ""} ${disabled ? "disabled" : ""}" data-radio-row>
          <input type="radio" name="player-pick" data-player-radio value="${esc(p.name)}" ${selected ? "checked" : ""} ${disabled || S.saving ? "disabled" : ""} style="accent-color:var(--accent);width:16px;height:16px" />
          <div class="avatar">${initials(p.name)}</div>
          <div class="player-num mono">${p.num}</div>
          <div style="flex:1">
            <div class="player-name">${esc(p.name)}</div>
            <div class="player-pos">${esc(p.pos)}</div>
          </div>
        </label>`;
      }).join("")}
    </div>`;

  const bonusBlock = `
    <div class="card">
      <div class="eyebrow mono" style="margin-bottom:10px">BONUS · 1 UTILISATION PAR SAISON CHACUN</div>
      <div class="stack" style="gap:8px">
        ${bonusRowHtml({
          icon: "🥂", title: "Cocu", description: "Double les points de ton joueur sur cette journée.",
          active: !!(d.myPick && d.myPick.cocu), locked: d.cocuLocked, lockedNote: d.cocuLocked ? `déjà utilisé — J${d.cocuJ}` : null,
          disabled: !S.pseudo || !d.myPick || !d.bettingOpen, onclick: "toggleBonus('cocu')",
        })}
        ${bonusRowHtml({
          icon: "📹", photoUrl: JEAN_MARC_PHOTO_URL, title: "Vidéo Jean Marc", subtitle: "(Jean-Marc Dupraz)",
          description: "Annule les points de ton joueur si son évaluation +/- est mauvaise (score négatif ramené à 0). Aucun effet si l'évaluation est bonne.",
          active: !!(d.myPick && d.myPick.jeanmarc), locked: d.jeanmarcLocked, lockedNote: d.jeanmarcLocked ? `déjà utilisé — J${d.jeanmarcJ}` : null,
          disabled: !S.pseudo || !d.myPick || !d.bettingOpen, onclick: "toggleBonus('jeanmarc')",
        })}
      </div>
      <p class="faint" style="margin-top:10px">Choisis d'abord ton joueur, puis active un bonus si tu veux le jouer sur cette journée. Une fois la journée clôturée, le bonus utilisé est définitivement consommé pour la saison.</p>
    </div>`;

  const jokerOptions = PLAYERS.filter((p) => !d.myPick || p.name !== d.myPick.player)
    .map((p) => `<option value="${esc(p.name)}" ${d.myPick && d.myPick.joker === p.name ? "selected" : ""}>${esc(p.name)}</option>`).join("");

  const jokerBlock = `
    <div class="card">
      <div class="eyebrow mono" style="margin-bottom:8px">🪑 JOKER BANC · ILLIMITÉ</div>
      <p class="muted" style="margin:0 0 10px">S'active automatiquement si ton titulaire ne joue pas le match (marqué par l'admin). Sinon il ne sert à rien — aucun risque à le renseigner à l'avance. Modifiable jusqu'à ${JOKER_GRACE_MINUTES} min après le début du match.</p>
      <select id="joker-select" class="field" ${!S.pseudo || !d.myPick || !d.jokerOpen ? "disabled" : ""} onchange="setJoker(this.value)">
        <option value="">— Pas de joker —</option>
        ${jokerOptions}
      </select>
      ${!d.jokerOpen ? `<p class="faint" style="color:var(--danger);margin-top:8px">Marge de ${JOKER_GRACE_MINUTES} min dépassée — joker verrouillé pour cette journée.</p>` : ""}
    </div>`;

  const predictionBlock = `
    <div class="card">
      <div class="eyebrow mono" style="margin-bottom:8px">🏀 PRONO MATCH</div>
      <p class="muted" style="margin:0 0 10px">Devine le score final. Score exact = <strong style="color:var(--text-bright)">+15</strong>, bon vainqueur + écart à ±5 près = <strong style="color:var(--text-bright)">+6</strong>, bon vainqueur seul = <strong style="color:var(--text-bright)">+3</strong>, mauvais vainqueur = 0. Se cumule avec les points de ton joueur.</p>
      <div class="field-pair">
        <div>
          <label class="field-label">Score CSP</label>
          <input id="pred-csp" type="number" min="0" value="${d.myPrediction ? d.myPrediction.csp : ""}" ${!S.pseudo || !d.bettingOpen ? "disabled" : ""} class="mono" style="width:100%;text-align:center;border-radius:10px;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
        </div>
        <div class="mono" style="align-self:flex-end;padding-bottom:9px;color:var(--text-faint)">–</div>
        <div>
          <label class="field-label">Score adversaire</label>
          <input id="pred-adv" type="number" min="0" value="${d.myPrediction ? d.myPrediction.adv : ""}" ${!S.pseudo || !d.bettingOpen ? "disabled" : ""} class="mono" style="width:100%;text-align:center;border-radius:10px;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
        </div>
      </div>
      <button class="btn-gold" style="width:100%;margin-top:12px" ${!S.pseudo || !d.bettingOpen || S.saving ? "disabled" : ""} onclick="submitPrediction()">${d.myPrediction ? "Modifier mon prono" : "Valider mon prono"}</button>
      ${d.myPrediction ? `<p class="faint" style="text-align:center;margin-top:8px">Prono enregistré : CSP ${d.myPrediction.csp} - ${d.myPrediction.adv}</p>` : ""}
    </div>`;

  return `<div class="stack">
    ${identBlock}
    ${fixtureBlock}
    ${statusBlock}
    ${playersBlock}
    ${bonusBlock}
    ${jokerBlock}
    ${predictionBlock}
  </div>`;
}

function bonusRowHtml({ icon, photoUrl, title, subtitle, description, active, locked, lockedNote, disabled, onclick }) {
  const avatar = photoUrl
    ? `<img src="${photoUrl}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid ${active ? "var(--accent)" : "var(--border)"}" />`
    : `<div class="bonus-icon">${icon}</div>`;
  return `
  <button class="bonus-row ${active ? "active" : ""}" ${disabled || locked ? "disabled" : ""} onclick="${onclick}">
    ${avatar}
    <div style="flex:1">
      <div class="bonus-title">${title}${subtitle ? `<span class="faint" style="font-weight:400">${subtitle}</span>` : ""}</div>
      <div class="bonus-desc">${description}</div>
    </div>
    <div class="bonus-status" style="color:${locked ? "var(--danger)" : active ? "var(--accent)" : "var(--text-faint)"}">${locked ? lockedNote : active ? "ACTIVÉ" : "1×/saison"}</div>
  </button>`;
}

// ---------------------------- classement tab ----------------------------
function renderClassement(d, ranking) {
  const closedCount = Object.values(S.meta.journees).filter((j) => j.status === "closed").length;
  const { journeeMvp, history } = computeSuivi(ranking);

  const mvpBlock = journeeMvp.length > 0 ? `
    <div class="card card-tight">
      <div class="mono faint" style="margin-bottom:8px;letter-spacing:0.15em">🏆 MVP DE LA JOURNÉE</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${journeeMvp.map(({ j, best, score }) => `<span class="chip">J${j} · ${esc(best || "—")} ${score != null ? `(${score > 0 ? "+" : ""}${score})` : ""}</span>`).join("")}
      </div>
    </div>` : "";

  const listBlock = ranking.length === 0 ? `
    <div class="muted" style="border:1px dashed var(--border);border-radius:14px;padding:24px;text-align:center">
      Aucune journée clôturée pour l'instant. Le classement apparaîtra ici après la première clôture par l'admin.
    </div>` : `
    <div class="stack" style="gap:8px">
      ${ranking.map((r, i) => {
        const h = history.find((x) => x.who === r.who);
        const medal = i === 0 ? "#ffd27a" : i === 1 ? "#e3e3df" : i === 2 ? "#cf9a63" : "var(--text-faint)";
        return `
        <div class="rank-row ${r.who === S.pseudo ? "me" : ""}">
          <div class="rank-head">
            <div style="display:flex;align-items:center;gap:12px">
              <div class="rank-pos" style="color:${medal}">${i + 1}</div>
              <div class="rank-name">${esc(r.who)}</div>
            </div>
            <div class="rank-total mono">${r.total > 0 ? "+" + r.total : r.total}</div>
          </div>
          ${h && h.points.length >= 2 ? `<div style="margin-top:8px;margin-left:44px">${sparklineSVG(h.points, "#ffffff")}</div>` : ""}
          <div class="chip-row">
            ${r.detail.map((dt) => dt.kind === "prono"
              ? `<span class="chip">J${dt.j} · 🏀 prono ${dt.pred.csp}-${dt.pred.adv} (réel ${dt.result.csp}-${dt.result.adv}) · ${dt.score > 0 ? "+" + dt.score : dt.score}</span>`
              : `<span class="chip">J${dt.j} · ${esc(dt.playerUsed.split(" ").slice(-1)[0])} · ${dt.jeanmarcSaved ? `<s style="opacity:.7">${dt.base > 0 ? "+" + dt.base : dt.base}</s> → 0` : (dt.score > 0 ? "+" + dt.score : dt.score)}${dt.cocu ? " 🥂×2" : ""}${dt.jeanmarc ? " 📹" : ""}${dt.jokerUsed ? " 🪑" : ""}</span>`
            ).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;

  return `<div class="stack">
    <div class="status-line">
      <div>${closedCount} JOURNÉE${closedCount > 1 ? "S" : ""} CLÔTURÉE${closedCount > 1 ? "S" : ""}</div>
      <button class="link" style="color:var(--accent)" onclick="refreshAll()">actualiser</button>
    </div>
    ${mvpBlock}
    ${listBlock}
  </div>`;
}

// ---------------------------- admin tab ----------------------------
function renderAdmin(d) {
  if (!S.adminOk) {
    return `<div class="stack">
      <div class="card">
        <div class="eyebrow mono" style="margin-bottom:8px">ACCÈS ADMIN</div>
        <p class="muted" style="margin:0 0 12px">Réservé à la personne qui saisit les évaluations LNB après chaque match.</p>
        <div class="row">
          <input id="admin-code-input" type="password" placeholder="Code admin" onkeydown="if(event.key==='Enter') checkAdminCode()" />
          <button class="btn-gold" onclick="checkAdminCode()">Entrer</button>
        </div>
      </div>
    </div>`;
  }

  const statusColor = d.currentStatus === "open" ? "var(--accent)" : "var(--danger)";
  const controls = d.currentStatus === "open"
    ? `<button class="btn-danger" onclick="closeJournee()">Clôturer</button>`
    : `<button class="btn-ghost" onclick="reopenJournee()">Rouvrir</button><button class="btn-gold" style="border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 12px" onclick="newJournee()">Journée suivante</button>`;

  const whitelistRows = S.whitelist.map((name) => `
    <div class="admin-participant">
      <div class="admin-participant-name">${esc(name)} <span class="mono faint" style="margin-left:6px">${S.pins[name] ? "code défini" : "pas encore connecté"}</span></div>
      <div class="admin-actions">
        ${S.pins[name] ? `<button class="link" onclick="resetPin('${esc(name)}')">réinitialiser le code</button>` : ""}
        <button class="link" style="color:var(--danger)" onclick="removeFromWhitelist('${esc(name)}')">retirer</button>
      </div>
    </div>`).join("");

  const playerRows = PLAYERS.map((p) => {
    const jd = d.currentJd;
    const isDnp = !!(jd.dnp && jd.dnp[p.name]);
    const scoreVal = jd.scores && jd.scores[p.name] != null ? jd.scores[p.name] : "";
    return `
    <div style="display:flex;align-items:center;gap:12px;border-radius:14px;border:1px solid var(--border);background:var(--card);padding:10px 16px">
      <div style="flex:1;font-size:14px;color:var(--text-bright)">${esc(p.name)}</div>
      <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted)">
        <input type="checkbox" id="dnp-${slug(p.name)}" ${isDnp ? "checked" : ""} onchange="document.getElementById('score-${slug(p.name)}').disabled=this.checked" />
        n'a pas joué
      </label>
      <input type="number" id="score-${slug(p.name)}" value="${scoreVal}" placeholder="+/-" ${isDnp ? "disabled" : ""} class="mono" style="width:76px;text-align:center;border-radius:10px;padding:7px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
    </div>`;
  }).join("");

  const picksReceived = Object.entries((S.picks[d.currentJ] || {})).map(([who, raw]) => {
    const p = normalizePick(raw);
    return `<span class="chip">${esc(who)} → ${esc(p.player)}${p.cocu ? " 🥂" : ""}${p.jeanmarc ? " 📹" : ""}</span>`;
  }).join("");

  return `<div class="stack">
    <div class="status-line">
      <div>JOURNÉE ${S.meta.current} — <span style="color:${statusColor}">${d.currentStatus.toUpperCase()}</span></div>
      <div style="display:flex;gap:8px">${controls}</div>
    </div>

    <div class="card">
      <div class="eyebrow mono" style="margin-bottom:8px">PARTICIPANTS AUTORISÉS</div>
      <p class="faint" style="margin:0 0 10px">
        ${S.whitelist.length === 0
          ? "Aucune restriction pour l'instant : n'importe quel pseudo peut jouer. Ajoute au moins un nom pour activer la liste fermée (chaque pseudo sera protégé par un code une fois utilisé)."
          : "Seuls ces pseudos peuvent participer. Chacun choisit son propre code à la première connexion."}
      </p>
      <div class="row" style="margin-bottom:10px">
        <input id="whitelist-input" type="text" placeholder="Ajouter un pseudo" onkeydown="if(event.key==='Enter') addToWhitelist()" />
        <button class="btn-gold" onclick="addToWhitelist()">Ajouter</button>
      </div>
      <div class="stack" style="gap:6px">${whitelistRows}</div>
    </div>

    <div class="card">
      <div class="eyebrow mono" style="margin-bottom:8px">RENCONTRE &amp; DÉLAI DE PARIS</div>
      <label class="field-label">Affiche (ex : CSP Limoges – Nanterre 92)</label>
      <input id="fixture-input" type="text" value="${esc(d.fixture)}" placeholder="CSP Limoges – Adversaire" style="width:100%;margin-bottom:10px;border-radius:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
      <div class="field-pair">
        <div>
          <label class="field-label">Ouverture des paris</label>
          <input id="opens-input" type="datetime-local" value="${d.opensAt}" class="mono" style="width:100%;border-radius:10px;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
        </div>
        <div>
          <label class="field-label">Fermeture des paris</label>
          <input id="closes-input" type="datetime-local" value="${d.closesAt}" class="mono" style="width:100%;border-radius:10px;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
        </div>
      </div>
      <p class="faint" style="margin:10px 0">Passé ce délai, les joueurs ne pourront plus modifier ni activer de bonus, même si tu n'as pas encore cliqué sur "Clôturer".</p>
      <button class="btn-gold" style="width:100%" onclick="saveMatchInfo()">Enregistrer la rencontre</button>
    </div>

    <div class="card">
      <div class="eyebrow mono" style="margin-bottom:8px">RÉSULTAT DU MATCH (PRONO)</div>
      <p class="faint" style="margin:0 0 10px">Score final, utilisé pour calculer les points du Prono Match de chacun.</p>
      <div class="field-pair">
        <div>
          <label class="field-label">Score CSP</label>
          <input id="result-csp-input" type="number" min="0" value="${d.currentJd.matchResult ? d.currentJd.matchResult.csp : ""}" class="mono" style="width:100%;text-align:center;border-radius:10px;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
        </div>
        <div>
          <label class="field-label">Score adversaire</label>
          <input id="result-adv-input" type="number" min="0" value="${d.currentJd.matchResult ? d.currentJd.matchResult.adv : ""}" class="mono" style="width:100%;text-align:center;border-radius:10px;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text-primary)" />
        </div>
      </div>
      <button class="btn-gold" style="width:100%;margin-top:10px" onclick="saveMatchResult()">Enregistrer le résultat</button>
    </div>

    <p class="faint">Saisis l'évaluation +/- LNB de chaque joueur pour le match de la journée en cours, puis enregistre. Clôture la journée pour figer le classement (les bonus actifs seront appliqués automatiquement).</p>

    <div class="stack" style="gap:8px">${playerRows}</div>

    <button class="btn-gold" style="width:100%" onclick="saveScores()">Enregistrer les scores</button>

    <div style="padding-top:8px;border-top:1px solid var(--border)">
      <div class="mono faint" style="margin-bottom:8px;letter-spacing:0.1em">PRONOSTICS REÇUS — JOURNÉE ${S.meta.current}</div>
      ${picksReceived ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${picksReceived}</div>` : `<div class="faint">Aucun pronostic pour l'instant.</div>`}
    </div>
  </div>`;
}

// ---------------------------- misc handlers ----------------------------
function attachHandlers(d) {
  document.querySelectorAll("[data-player-radio]").forEach((el) => {
    el.addEventListener("change", () => submitPick(el.value));
  });
}

// live clock: only touches the status badge text/color + disables inputs, no full re-render
function tick() {
  S.now = new Date();
  if (S.tab !== "pronostic" || S.loading) return;
  const d = derived();
  const statusEl = document.getElementById("status-text");
  if (statusEl) {
    const label = d.bettingOpen ? "PRONOSTICS OUVERTS" : d.beforeOpening ? "PAS ENCORE OUVERTS" : d.pastDeadline ? "DÉLAI DÉPASSÉ" : "CLÔTURÉE";
    statusEl.textContent = label;
    statusEl.style.color = d.bettingOpen ? "var(--accent)" : "var(--danger)";
  }
  if (!d.bettingOpen) {
    document.querySelectorAll("[data-player-radio]").forEach((el) => (el.disabled = true));
    document.querySelectorAll(".player-row").forEach((el) => el.classList.add("disabled"));
  }
}

document.addEventListener("DOMContentLoaded", () => {
  init();
  setInterval(tick, 15000);
});

</script>
</body>
</html>
