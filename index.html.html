<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantasy Kop 7</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #146c3f;
    --card: #1c7f4c;
    --card-selected: #0d5233;
    --border: #2f9463;
    --border-hover: #4bb37f;
    --accent: #ffffff;
    --text-bright: #ffffff;
    --text-primary: #ffffff;
    --text-muted: #dff5e6;
    --text-faint: #a8dcbc;
    --danger: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .glow { box-shadow: 0 0 0 1px rgba(255,255,255,0.22), 0 8px 30px -10px rgba(0,0,0,0.5); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select { font-family: inherit; }
  a { color: inherit; }

  header.top { border-bottom: 1px solid var(--border); }
  .header-inner { padding: 32px 0 24px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 56px; height: auto; flex-shrink: 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.3em; color: var(--accent); margin-bottom: 4px; }
  h1.title { font-size: 40px; line-height: 1; margin: 0; color: var(--text-bright); }
  .journee-box { text-align: right; }
  .journee-label { font-size: 10px; letter-spacing: 0.15em; color: var(--text-faint); }
  .journee-num { font-size: 30px; line-height: 1; color: var(--accent); }
  .subtitle { margin-top: 12px; font-size: 14px; color: var(--text-muted); max-width: 560px; }

  nav.tabs { display: flex; gap: 8px; margin-top: 20px; }
  nav.tabs button {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.02em;
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted);
  }
  nav.tabs button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

  main { padding: 24px 0 60px; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .card-tight { padding: 14px 16px; }
  .card h3.eyebrow { margin: 0 0 8px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .faint { color: var(--text-faint); font-size: 11px; }

  .row { display: flex; gap: 8px; }
  .row input[type=text], .row input[type=password], .row input[type=number] {
    flex: 1; border-radius: 10px; padding: 9px 12px; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-primary); outline: none;
  }
  .btn-gold {
    background: var(--accent); color: var(--bg); font-weight: 700; font-size: 14px;
    padding: 9px 16px; border-radius: 10px;
  }
  .btn-gold:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 999px; padding: 6px 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .btn-danger { background: var(--danger); color: var(--bg); font-weight: 700; border-radius: 999px; padding: 6px 12px; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .link { text-decoration: underline; text-underline-offset: 2px; font-size: 11px; font-family: 'JetBrains Mono', monospace; background: none; color: var(--text-faint); }

  .status-line { display: flex; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-faint); }

  .player-row {
    display: flex; align-items: center; gap: 12px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); padding: 12px 16px; cursor: pointer; transition: border-color .15s;
  }
  .player-row.selected { border-color: var(--accent); background: var(--card-selected); }
  .player-row.disabled { opacity: .6; cursor: not-allowed; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    background: var(--bg); border: 1.5px solid var(--border); color: var(--text-primary);
  }
  .player-row.selected .avatar { border-color: var(--accent); }
  .player-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-faint); width: 22px; text-align: right; flex-shrink: 0; }
  .player-name { font-size: 14px; font-weight: 600; color: var(--text-bright); }
  .player-pos { font-size: 11px; color: var(--text-muted); }

  .bonus-row {
    width: 100%; display: flex; align-items: center; gap: 12px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg); padding: 10px 14px; text-align: left;
  }
  .bonus-row.active { border-color: var(--accent); background: var(--card-selected); }
  .bonus-row:disabled { opacity: .6; cursor: not-allowed; }
  .bonus-icon { font-size: 20px; line-height: 1; }
  .bonus-title { font-size: 14px; font-weight: 600; color: var(--text-bright); display: flex; gap: 6px; align-items: baseline; }
  .bonus-desc { font-size: 11px; color: var(--text-muted); }
  .bonus-status { font-family: 'JetBrains Mono', monospace; font-size: 10px; flex-shrink: 0; text-align: right; }

  select.field {
    width: 100%; border-radius: 10px; padding: 9px 12px; font-size: 14px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text-primary); outline: none;
  }
  label.field-label { display: block; font-size: 11px; margin-bottom: 4px; color: var(--text-faint); }

  .rank-row { border-radius: 14px; border: 1px solid var(--border); background: var(--card); padding: 12px 16px; }
  .rank-row.me { border-color: var(--accent); background: var(--card-selected); }
  .rank-head { display: flex; align-items: center; justify-content: space-between; }
  .rank-pos { font-family: 'Anton', sans-serif; font-size: 18px; width: 32px; text-align: center; }
  .rank-name { font-size: 14px; font-weight: 600; color: var(--text-bright); }
  .rank-total { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--accent); }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }
  .chip-row { margin-top: 8px; margin-left: 44px; display: flex; flex-wrap: wrap; gap: 6px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card-selected); border: 1px solid rgba(255,255,255,0.5); color: var(--text-bright);
    font-size: 14px; padding: 10px 16px; border-radius: 12px; z-index: 50;
    max-width: calc(100% - 40px);
  }

  .admin-participant { display: flex; align-items: center; justify-content: between; gap: 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; }
  .admin-participant-name { flex: 1; font-size: 14px; color: var(--text-bright); }
  .admin-actions { display: flex; gap: 10px; }

  .field-pair { display: flex; gap: 12px; }
  .field-pair > div { flex: 1; }

  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
</style>
</head>
