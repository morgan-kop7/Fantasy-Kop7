<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantasy Kop 7</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#146c3f;
  --card:#1c7f4c;
  --card-selected:#0d5233;
  --border:#2f9463;
  --accent:#ffffff;
  --text:#ffffff;
  --muted:#dff5e6;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px;
}

header{
  padding:20px 0;
  border-bottom:1px solid var(--border);
}

h1{
  margin:0;
  font-family:'Anton',sans-serif;
  letter-spacing:1px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-top:20px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
}

.btn{
  background:white;
  color:#146c3f;
}

.player{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:10px;
  cursor:pointer;
}

.player.active{
  background:var(--card-selected);
  border-color:white;
}

input{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  width:100%;
  background:#0f5a35;
  color:white;
}

.row{
  display:flex;
  gap:10px;
}

.small{
  font-size:13px;
  color:var(--muted);
}

.rank{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h1>FANTASY KOP 7</h1>
  <div class="small">Version GitHub Pages corrigée</div>
</header>

<div class="card">
  <h3>Connexion</h3>

  <div class="row">
    <input id="pseudo" placeholder="Ton pseudo">
    <button class="btn" onclick="login()">OK</button>
  </div>

  <div id="user" class="small" style="margin-top:10px"></div>
</div>

<div class="card">
  <h3>Choisis ton joueur</h3>

  <div id="players"></div>
</div>

<div class="card">
  <h3>Classement</h3>

  <div id="ranking"></div>
</div>

</div>

<script>

/* =========================
   STORAGE FIX GITHUB PAGES
========================= */

if (!window.storage) {
  window.storage = {
    async get(key) {
      const value = localStorage.getItem(key);
      if (value === null) return null;
      return { value };
    },

    async set(key, value) {
      localStorage.setItem(key, value);
      return true;
    }
  };
}

/* =========================
   DATA
========================= */

const PLAYERS = [
  "Andrew Albicy",
  "Tai Webster",
  "D.J. Horne",
  "Nicolas Lang",
  "Hugo Invernizzi",
  "Gavin Ware"
];

const state = {
  user:"",
  picks:{}
};

/* =========================
   INIT
========================= */

async function init(){

  const user = await storage.get("fk7-user");
  const picks = await storage.get("fk7-picks");

  if(user){
    state.user = user.value;
  }

  if(picks){
    state.picks = JSON.parse(picks.value);
  }

  render();
}

/* =========================
   LOGIN
========================= */

async function login(){

  const value = document.getElementById("pseudo").value.trim();

  if(!value){
    alert("Entre un pseudo");
    return;
  }

  state.user = value;

  await storage.set("fk7-user", value);

  render();
}

/* =========================
   PICK
========================= */

async function selectPlayer(name){

  if(!state.user){
    alert("Connecte-toi d'abord");
    return;
  }

  state.picks[state.user] = name;

  await storage.set(
    "fk7-picks",
    JSON.stringify(state.picks)
  );

  render();
}

/* =========================
   RENDER
========================= */

function render(){

  document.getElementById("user").innerHTML =
    state.user
      ? `Connecté : <strong>${state.user}</strong>`
      : "Non connecté";

  renderPlayers();
  renderRanking();
}

function renderPlayers(){

  const currentPick = state.picks[state.user];

  document.getElementById("players").innerHTML =
    PLAYERS.map(p => `
      <div
        class="player ${currentPick === p ? 'active' : ''}"
        onclick="selectPlayer('${p}')"
      >
        ${p}
      </div>
    `).join("");
}

function renderRanking(){

  const entries = Object.entries(state.picks);

  if(entries.length === 0){
    document.getElementById("ranking").innerHTML =
      `<div class="small">Aucun joueur enregistré</div>`;
    return;
  }

  document.getElementById("ranking").innerHTML =
    entries.map(([user,pick],i)=>`
      <div class="rank">
        <strong>#${i+1} ${user}</strong>
        <span>${pick}</span>
      </div>
    `).join("");
}

/* =========================
   START
========================= */

init();

</script>

</body>
</html>
